name: Package CharacterSimulator Skill
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and package skill
        run: python scripts/validate_skill.py
      - name: Upload skill archives
        uses: actions/upload-artifact@v4
        with:
          name: character-simulator-distribution
          path: |
            dist/character-simulator-chatgpt.zip
            dist/character-simulator.skill
          if-no-files-found: error
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/character-simulator-chatgpt.zip dist/character-simulator.skill --generate-notes --verify-tag
