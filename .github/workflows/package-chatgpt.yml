name: Package CharacterSimulator for ChatGPT
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build plugin ZIP
        run: python scripts/package_chatgpt.py
      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: character-simulator-chatgpt
          path: dist/character-simulator-chatgpt.zip
          if-no-files-found: error
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/character-simulator-chatgpt.zip --generate-notes --verify-tag
